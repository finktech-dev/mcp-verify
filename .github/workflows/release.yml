name: Release CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already present in package.json"
        required: true
        type: string
      publish:
        description: "Publish the validated CLI package to npm"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-cli
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  CI: true

jobs:
  validate:
    name: Validate CLI release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Verify requested version
        run: test "${{ inputs.version }}" = "$(node -p \"require('./package.json').version\")"
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:security
      - run: npm run test:scenario
      - run: npm run build
      - run: npm run test:release-smoke
      - run: npm run pack:check

  publish:
    name: Publish CLI package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    if: inputs.publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npm run build
      - run: npm publish --provenance --access public
